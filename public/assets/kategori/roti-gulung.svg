<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Roti Gulung">
    <!-- Bayangan -->
    <ellipse cx="50" cy="84" rx="40" ry="7" fill="#E8B8AE" fill-opacity="0.5"/>
    <!-- Batang Roti Gulung (3D Body memanjang ke belakang) -->
    <path d="M38 28 L72 38 C76 39, 84 48, 84 56 C84 64, 76 71, 70 72 L36 62 Z" fill="#D97706"/>
    <path d="M38 28 L72 38 C74 39, 78 44, 79 50 L42 42 Z" fill="#FBBF24"/>
    <!-- Taburan Gula Halus / Pola Atas Roti -->
    <line x1="46" y1="33" x2="52" y2="35" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="56" y1="36" x2="63" y2="38" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="66" y1="39" x2="72" y2="41" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Penampang Melintang Irisan Depan (Spiral Gulungan Spons) -->
    <ellipse cx="36" cy="52" rx="22" ry="20" fill="#FEF3C7"/>
    <ellipse cx="36" cy="52" rx="22" ry="20" stroke="#B45309" stroke-width="3"/>
    <!-- Spiral Krim Selai Maroon/Cokelat -->
    <path d="M48 42 C54 48, 51 60, 44 65 C36 71, 23 66, 20 54 C17 41, 28 32, 40 33 C49 34, 52 42, 50 48 C48 54, 41 57, 36 55 C31 53, 31 46, 36 45 C38 44, 41 46, 40 49" fill="none" stroke="#6B0F1A" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Inti Krim Tengah -->
    <circle cx="38" cy="49" r="3" fill="#FFFBEB"/>
</svg>
